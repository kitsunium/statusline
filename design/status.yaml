# The libraries both roles share: the quotas, the collected snapshot, and
# the contract between the two processes.
apiVersion: kit.kitsunium/design/v1
domains:
  - name: status
    description: What a status line is made of, whichever process holds it.
    components:
      - name: quota
        role: library
        code: 64.1.1
        path: quota
        description: The context window and the account's rate limits. Pure; time is an argument.
        evidence: [quota-sources]
        constants:
          - {name: KindContext, type: Kind, value: '"context"', description: "KindContext is the context window of the conversation."}
          - {name: KindSession, type: Kind, value: '"session"', description: "KindSession is the rolling 5-hour quota."}
          - {name: KindWeekly, type: Kind, value: '"weekly"', description: "KindWeekly is the rolling 7-day quota, all models."}
          - {name: KindScoped, type: Kind, value: '"weekly_scoped"', description: "KindScoped is a 7-day quota restricted to one model family."}
          - {name: KindExtra, type: Kind, value: '"extra"', description: "KindExtra is the monthly extra-usage credit balance."}
          - {name: SourceStdin, type: Source, value: '"stdin"', description: "SourceStdin is the payload the host pipes on every redraw."}
          - {name: SourceAPI, type: Source, value: '"api"', description: "SourceAPI is the OAuth usage endpoint."}
          - {name: SourceNone, type: Source, value: '""', description: "SourceNone marks an absent limit."}
          - {name: LevelLow, type: Level, value: "0"}
          - {name: LevelMedium, type: Level, value: "1"}
          - {name: LevelHigh, type: Level, value: "2"}
          - {name: LevelCritical, type: Level, value: "3"}
          - {name: SessionWindow, type: time.Duration, value: "5 * time.Hour", description: "SessionWindow is the rolling 5-hour rate limit window."}
          - {name: WeeklyWindow, type: time.Duration, value: "7 * 24 * time.Hour", description: "WeeklyWindow is the rolling 7-day rate limit window."}
        values:
          - {name: Kind, underlying: string, description: "Kind identifies which quota a Limit measures; plans expose different subsets."}
          - {name: Source, underlying: string, description: "Source records where a Limit was read from: stdin is authoritative and free, the API costs a request."}
          - {name: Level, underlying: int, description: "Level is the severity of a consumption."}
          - name: Progress
            description: A consumption percentage.
            fields:
              - {name: Percent, type: int, tag: 'json:"percent"'}
            methods:
              - {name: Level, results: [{type: Level}], properties: [Monotonic]}
          - name: Timestamp
            description: An instant written as a Unix epoch in seconds or as an RFC 3339 string; anything else is the zero instant, never an error.
            fields:
              - {type: time.Time, embedded: true}
          - name: Limit
            description: One quota and its refill schedule. A zero Limit means the plan does not expose it — never 0 %.
            fields:
              - {name: Kind, type: Kind, tag: 'json:"kind,omitempty"'}
              - {name: Label, type: string, tag: 'json:"label,omitempty"'}
              - {name: Percent, type: int, tag: 'json:"percent,omitempty"'}
              - {name: ResetsAt, type: time.Time, tag: 'json:"resets_at,omitzero"'}
              - {name: Window, type: time.Duration, tag: 'json:"window,omitempty"'}
              - {name: Active, type: bool, tag: 'json:"active,omitempty"'}
              - {name: Source, type: Source, tag: 'json:"source,omitempty"'}
            methods:
              - {name: IsValid, results: [{type: bool}], properties: [NeedsSource]}
              - {name: HasWindow, results: [{type: bool}], properties: [NeedsBoth]}
              - {name: Remaining, params: [{name: now, type: time.Time}], results: [{type: time.Duration}], properties: [NeverNegative]}
              - {name: Elapsed, params: [{name: now, type: time.Time}], results: [{type: float64}], properties: [Bounded]}
              - {name: CursorPosition, params: [{name: now, type: time.Time}], results: [{type: int}], properties: [Bounded]}
              - {name: Pace, params: [{name: now, type: time.Time}], results: [{type: int}], properties: [AgainstCursor]}
              - {name: IsOnTrack, params: [{name: now, type: time.Time}], results: [{type: bool}], properties: [MatchesPace]}
              - {name: Projected, params: [{name: now, type: time.Time}], results: [{type: int}], properties: [NonNegative]}
              - {name: ExhaustsIn, params: [{name: now, type: time.Time}], results: [{type: time.Duration}, {type: bool}], properties: [BeforeReset]}
              - {name: Progress, results: [{type: Progress}], properties: [KeepsPercent]}
          - name: Extra
            description: The monthly extra-usage credit balance, in minor units.
            fields:
              - {name: Enabled, type: bool, tag: 'json:"enabled,omitempty"'}
              - {name: Percent, type: int, tag: 'json:"percent,omitempty"'}
              - {name: UsedMinor, type: int, tag: 'json:"used_minor,omitempty"'}
              - {name: LimitMinor, type: int, tag: 'json:"limit_minor,omitempty"'}
              - {name: Currency, type: string, tag: 'json:"currency,omitempty"'}
              - {name: Exponent, type: int, tag: 'json:"exponent,omitempty"'}
              - {name: Source, type: Source, tag: 'json:"source,omitempty"'}
            methods:
              - {name: IsValid, results: [{type: bool}], properties: [RequiresEnabled]}
          - name: Set
            description: Every quota that applies to the session; any field but Context may be absent.
            fields:
              - {name: Context, type: Limit, tag: 'json:"context"'}
              - {name: Session, type: Limit, tag: 'json:"session"'}
              - {name: Weekly, type: Limit, tag: 'json:"weekly"'}
              - {name: Scoped, type: "[]Limit", tag: 'json:"scoped,omitempty"'}
              - {name: Extra, type: Extra, tag: 'json:"extra"'}
            methods:
              - {name: Timed, results: [{type: "[]Limit"}], properties: [OnlyValid]}
              - {name: HasTimed, results: [{type: bool}], properties: [MatchesTimed]}
              - {name: ScopedFor, params: [{name: modelName, type: string}], results: [{type: "[]Limit"}], properties: [SubsetOfScoped]}
        functions:
          - name: NewLimit
            description: NewLimit builds a Limit with its percentage clamped to 0–100.
            params:
              - {name: kind, type: Kind}
              - {name: label, type: string}
              - {name: percent, type: int}
              - {name: resetsAt, type: time.Time}
              - {name: window, type: time.Duration}
              - {name: source, type: Source}
            results: [{type: Limit}]
            properties: [PercentClamped]
          - {name: NewProgress, params: [{name: totalTokens, type: int}, {name: contextSize, type: int}], results: [{type: Progress}], properties: [Bounded]}
          - name: Resolve
            description: Resolve merges stdin's quotas with the API's — stdin wins, the API adds what stdin cannot know, an absent bucket stays absent.
            params: [{name: stdin, type: Set}, {name: api, type: Set}]
            results: [{type: Set}]
            properties: [StdinWins, NeverInvents]

      - name: snapshot
        role: library
        code: 64.1.2
        path: snapshot
        uses: [quota]
        description: What the daemon collects for one session and the client renders.
        constants:
          - {name: TaskPending, type: string, value: '"pending"'}
          - {name: TaskInProgress, type: string, value: '"in_progress"'}
          - {name: TaskWaiting, type: string, value: '"waiting"'}
          - {name: TaskCompleted, type: string, value: '"completed"'}
          - {name: NoEpic, type: int, value: "0", description: "NoEpic is the epic of tasks tied to none."}
          - {name: MCPSourceUnknown, type: MCPSource, value: '""'}
          - {name: MCPSourceManaged, type: MCPSource, value: '"managed"'}
          - {name: MCPSourceCLI, type: MCPSource, value: '"cli"'}
          - {name: MCPSourceLocal, type: MCPSource, value: '"local"'}
          - {name: MCPSourceProject, type: MCPSource, value: '"project"'}
          - {name: MCPSourceUser, type: MCPSource, value: '"user"'}
          - {name: MCPSourcePlugin, type: MCPSource, value: '"plugin"'}
          - {name: HealthUnknown, type: Health, value: "0"}
          - {name: HealthOK, type: Health, value: "1"}
          - {name: HealthDegraded, type: Health, value: "2"}
          - {name: HealthDown, type: Health, value: "3"}
          - {name: OSLinux, type: OS, value: "0"}
          - {name: OSDarwin, type: OS, value: "1"}
          - {name: OSWindows, type: OS, value: "2"}
          - {name: OSUnknown, type: OS, value: "3"}
        values:
          - {name: MCPSource, underlying: string, description: "MCPSource names the configuration scope that declared an MCP server."}
          - {name: Health, underlying: int, description: "Health is the aggregate state of the provider's public services."}
          - {name: OS, underlying: int, description: "OS is the operating system family."}
          - name: MCPServers
            underlying: "[]MCPServer"
            description: The MCP servers a session can reach, in precedence order.
            methods:
              - {name: WithSource, description: "WithSource tags every server with its scope, in place.", params: [{name: src, type: MCPSource}], results: [{type: MCPServers}], properties: [TagsEvery]}
              - {name: WithBusy, description: "WithBusy returns a copy with the servers being called lit, unknown ones appended.", params: [{name: keys, type: "[]string"}], results: [{type: MCPServers}], properties: [KeepsServers]}
          - name: GitStatus
            fields:
              - {name: Branch, type: string, tag: 'json:"branch,omitempty"'}
              - {name: Modified, type: int, tag: 'json:"modified,omitempty"'}
              - {name: Untracked, type: int, tag: 'json:"untracked,omitempty"'}
              - {name: Worktrees, type: int, tag: 'json:"worktrees,omitempty"'}
            methods:
              - {name: IsInRepo, results: [{type: bool}], properties: [MatchesBranch]}
          - name: Changes
            fields:
              - {name: Added, type: int, tag: 'json:"added,omitempty"'}
              - {name: Removed, type: int, tag: 'json:"removed,omitempty"'}
            methods:
              - {name: HasChanges, results: [{type: bool}], properties: [EitherSide]}
              - {name: HasAdded, results: [{type: bool}], properties: [Positive]}
              - {name: HasRemoved, results: [{type: bool}], properties: [Positive]}
          - name: MCPServer
            fields:
              - {name: Name, type: string, tag: 'json:"name"'}
              - {name: Enabled, type: bool, tag: 'json:"enabled,omitempty"'}
              - {name: Plugin, type: string, tag: 'json:"plugin,omitempty"'}
              - {name: Source, type: MCPSource, tag: 'json:"source,omitempty"'}
              - {name: Busy, type: bool, tag: 'json:"busy,omitempty"'}
          - name: TaskItem
            fields:
              - {name: ID, type: string, tag: 'json:"id"'}
              - {name: Subject, type: string, tag: 'json:"subject,omitempty"'}
              - {name: Status, type: string, tag: 'json:"status,omitempty"'}
          - name: TaskList
            fields:
              - {name: Items, type: "[]TaskItem", tag: 'json:"items,omitempty"'}
            methods:
              - {name: Total, results: [{type: int}], properties: [CountsItems]}
              - {name: Done, results: [{type: int}], properties: [CountsBounded]}
              - {name: Active, results: [{type: int}], properties: [CountsInProgress]}
              - {name: Waiting, results: [{type: int}], properties: [CountsWaiting]}
              - {name: Headline, results: [{type: string}, {type: string}], properties: [NeverCompleted]}
              - {name: Current, results: [{type: string}], properties: [InProgressOnly]}
              - {name: IsActive, results: [{type: bool}], properties: [MatchesCounts]}
          - name: Epic
            fields:
              - {name: ID, type: int, tag: 'json:"id"'}
              - {name: Title, type: string, tag: 'json:"title,omitempty"'}
              - {name: Active, type: bool, tag: 'json:"active,omitempty"'}
              - {name: Tasks, type: TaskList, tag: 'json:"tasks"'}
              - {name: Subagents, type: int, tag: 'json:"subagents,omitempty"'}
          - name: TaskBoard
            fields:
              - {name: Epics, type: "[]Epic", tag: 'json:"epics,omitempty"'}
              - {name: Unattributed, type: int, tag: 'json:"unattributed,omitempty"'}
            methods:
              - {name: IsEmpty, results: [{type: bool}], properties: [MatchesContent]}
          - name: System
            fields:
              - {name: OS, type: OS, tag: 'json:"os"'}
              - {name: IsDocker, type: bool, tag: 'json:"docker,omitempty"'}
          - name: UpdateNotice
            fields:
              - {name: Available, type: bool, tag: 'json:"available,omitempty"'}
              - {name: Version, type: string, tag: 'json:"version,omitempty"'}
          - name: Snapshot
            description: Everything collected for one session key.
            fields:
              - {name: WorkDir, type: string, tag: 'json:"work_dir,omitempty"'}
              - {name: Git, type: GitStatus, tag: 'json:"git"'}
              - {name: Changes, type: Changes, tag: 'json:"changes"'}
              - {name: MCP, type: MCPServers, tag: 'json:"mcp,omitempty"'}
              - {name: Tasks, type: TaskBoard, tag: 'json:"tasks"'}
              - {name: Working, type: bool, tag: 'json:"working,omitempty"'}
              - {name: System, type: System, tag: 'json:"system"'}
              - {name: Health, type: Health, tag: 'json:"health,omitempty"'}
              - {name: API, type: quota.Set, tag: 'json:"api"'}
              - {name: Update, type: UpdateNotice, tag: 'json:"update"'}
              - {name: CollectedAt, type: time.Time, tag: 'json:"collected_at"'}
        functions:
          - {name: ToolKey, params: [{name: name, type: string}], results: [{type: string}], properties: [Charset]}
          - {name: ClassifyHealth, params: [{name: states, type: "[]string"}], results: [{type: Health}], properties: [Monotonic]}

      - name: ipc
        role: library
        code: 64.1.3
        path: ipc
        uses: [snapshot]
        description: The contract between the client and the daemon (statusline.ipc/v1) — frames, handshake, instance paths.
        evidence: [one-binary-two-processes]
        constants:
          - {name: Protocol, type: string, value: '"statusline.ipc/v1"'}
          - {name: MaxFrame, type: int, value: "1048576", description: "MaxFrame bounds one frame, in bytes."}
          - {name: OpSnapshot, type: string, value: '"snapshot"'}
          - {name: OpStatus, type: string, value: '"status"'}
          - {name: OpStop, type: string, value: '"stop"'}
        errors:
          - {name: ErrFrameTooLarge, serial: 1, message: a frame is 1 MiB at most}
        values:
          - name: Hello
            fields:
              - {name: Protocol, type: string, tag: 'json:"protocol"'}
              - {name: Version, type: string, tag: 'json:"version"'}
              - {name: PID, type: int, tag: 'json:"pid"'}
          - name: Key
            description: What a session's state is kept by (D5) — session, transcript, directory — and the client's task list.
            fields:
              - {name: SessionID, type: string, tag: 'json:"session_id,omitempty"'}
              - {name: TranscriptPath, type: string, tag: 'json:"transcript_path,omitempty"'}
              - {name: SessionDir, type: string, tag: 'json:"session_dir,omitempty"'}
              - {name: TaskListID, type: string, tag: 'json:"task_list_id,omitempty"'}
            methods:
              - {name: Hash, results: [{type: string}], properties: [Stable]}
          - name: Request
            fields:
              - {name: Op, type: string, tag: 'json:"op"'}
              - {name: Key, type: Key, tag: 'json:"key"'}
          - name: Network
            fields:
              - {name: UsageFetchedAt, type: time.Time, tag: 'json:"usage_fetched_at,omitzero"'}
              - {name: UsageAttemptAt, type: time.Time, tag: 'json:"usage_attempt_at,omitzero"'}
              - {name: UsageRetryAfter, type: time.Time, tag: 'json:"usage_retry_after,omitzero"'}
              - {name: UsageStatus, type: int, tag: 'json:"usage_status,omitempty"'}
              - {name: HealthFetchedAt, type: time.Time, tag: 'json:"health_fetched_at,omitzero"'}
              - {name: HealthAttemptAt, type: time.Time, tag: 'json:"health_attempt_at,omitzero"'}
          - name: Status
            fields:
              - {name: Version, type: string, tag: 'json:"version"'}
              - {name: PID, type: int, tag: 'json:"pid"'}
              - {name: Executable, type: string, tag: 'json:"executable"'}
              - {name: StartedAt, type: time.Time, tag: 'json:"started_at"'}
              - {name: LastRequest, type: time.Time, tag: 'json:"last_request,omitzero"'}
              - {name: Sessions, type: int, tag: 'json:"sessions"'}
              - {name: Network, type: Network, tag: 'json:"network"'}
              - {name: BadVersion, type: string, tag: 'json:"bad_version,omitempty"'}
          - name: Response
            fields:
              - {name: Snapshot, type: "*snapshot.Snapshot", tag: 'json:"snapshot,omitempty"'}
              - {name: Status, type: "*Status", tag: 'json:"status,omitempty"'}
              - {name: Error, type: string, tag: 'json:"error,omitempty"'}
          - name: Instance
            description: Where one daemon instance lives; both roles derive the same paths.
            fields:
              - {name: Dir, type: string}
              - {name: Socket, type: string}
              - {name: Cache, type: string}
              - {name: State, type: string}
              - {name: Log, type: string}
              - {name: PID, type: string}
              - {name: Heartbeat, type: string}
            methods:
              - {name: CachePath, params: [{name: key, type: Key}], results: [{type: string}], properties: [InsideCache]}
          - name: LocateInput
            description: "An instance is the framework's: the product's runtime directory, the key of its scopes (UID, executable, CLAUDE_CONFIG_DIR) — the same key its singleton takes — and the socket its listener opens (kit.SocketPathFor)."
            fields:
              - {name: RuntimeDir, type: string}
              - {name: Key, type: string}
              - {name: Socket, type: string}
        functions:
          - {name: Locate, params: [{name: in, type: LocateInput}], results: [{type: Instance}], properties: [Distinct]}
          - {name: Here, description: "Here locates the instance of the running executable: the framework's scope key, the product's runtime directory and its listener's socket.", results: [{type: Instance}, {type: error}], properties: [UnderRuntimeDir]}
          - {name: WriteFrame, params: [{name: w, type: io.Writer}, {name: v, type: any}], results: [{type: error}], properties: [LengthPrefixed]}
          - {name: ReadFrame, params: [{name: r, type: io.Reader}, {name: v, type: any}], results: [{type: error}], properties: [Roundtrip]}
          - {name: CompareVersions, params: [{name: a, type: string}, {name: b, type: string}], results: [{type: int}], properties: [Order]}
          - {name: Compatible, params: [{name: protocol, type: string}], results: [{type: bool}], properties: [MajorOne]}
