# The client role: turn the host's payload and the daemon's snapshot into the
# two lines, on every redraw, without ever waiting on the network.
apiVersion: kit.kitsunium/design/v1
kind: Domain
metadata:
  name: render
spec:
  components:
    - id: render/component/session
      role: domain
      package: render/session
      description: The host's stdin payload and what it says about the session.
      uses: [quota/component/quota]
    - id: render/component/powerline
      role: presentation
      package: render/powerline
      description: >-
        The Powerline renderer: segments, palette, glyphs, visible width and
        the condensing of line one to the terminal width. Its display
        variables (STATUSLINE_GLYPHS, _COLORS, _MCP_LINE, _WEIGHTS, _HIDE,
        _LINE_GAP, COLORTERM) are read by its body, once per process.
      uses: [quota/component/quota, snapshot/component/snapshot, render/component/session]
      evidence: [condense-policy-decision, palette-contrast-decision]
    - id: render/component/show
      type: "Shower"
      constructor: "New(deps Deps) *Shower"
      deps: "Deps{Clock port.Clock; Snapshots port.SnapshotSource}"
      role: application
      package: render/show
      uses: [quota/component/quota, snapshot/component/snapshot, ipc/component/ipc, render/component/session, render/component/powerline]
    - id: render/component/ctl
      type: "Status, Stop"
      constructor: "NewStatus(deps Deps) *Status; NewStop(deps Deps) *Stop"
      deps: "Deps{Daemon port.DaemonControl}"
      role: application
      package: render/ctl
      uses: [ipc/component/ipc]
    - id: render/component/cli
      type: "CLI"
      constructor: "New(deps Deps) *CLI"
      deps: "Deps{Show show.ShowStatusLine; Status ctl.DaemonStatus; Stop ctl.StopDaemon}"
      role: presentation
      package: render/cli
      description: The client role's entry. argv → use case; stdin and stdout; never exits non-zero on a bad payload.
      uses: [render/component/show, render/component/ctl]
    - id: render/component/daemonlink
      type: "Link"
      constructor: "New(cfg Config) *Link"
      deps: "Config{Instance ipc.Instance; Version string; Executable string; Budget time.Duration}"
      role: adapter
      package: render/daemonlink
      description: >-
        Dials the instance's socket under a bounded deadline, shakes hands,
        asks for the snapshot; on a missing, cold or incompatible daemon
        reads the instance's cache instead (≤ 50 ms) and starts the daemon
        with os.Executable() in the background. Never stops a newer daemon.
        A daemon that accepts but does not answer within the budget while
        its heartbeat is 10 s stale is mute: it is killed and replaced.
      uses: [ipc/component/ipc, snapshot/component/snapshot]
      implements: [render/port/snapshot-source@v1, render/port/daemon-control@v1]
    - id: render/component/systemclock
      type: "Clock"
      constructor: "New() *Clock"
      role: adapter
      package: render/systemclock
      implements: [render/port/clock@v1]

  # Port interfaces are generated whole into one package per domain; an
  # adapter asserts it implements them, a use case holds them.
  portsPackage: render/port
  ports:
    - id: render/port/snapshot-source@v1
      direction: outbound
      name: SnapshotSource
      methods:
        - {name: Snapshot, signature: "Snapshot(ctx context.Context, key ipc.Key) (snapshot.Snapshot, SnapshotOrigin)"}
    - id: render/port/daemon-control@v1
      direction: outbound
      name: DaemonControl
      methods:
        - {name: Status, signature: "Status(ctx context.Context) (ipc.Status, error)"}
        - {name: Stop, signature: "Stop(ctx context.Context) error"}
    - id: render/port/clock@v1
      direction: outbound
      name: Clock
      methods:
        - {name: Now, signature: "Now() time.Time"}

  valueObjects:
    - id: render/vo/snapshot-origin
      package: render/port
      name: SnapshotOrigin
      underlying: string
      values: {OriginDaemon: daemon, OriginCache: cache, OriginNone: none}
    # render/component/session
    - id: render/vo/payload
      component: render/component/session
      name: Payload
      description: The JSON the host pipes on stdin. Unknown fields are ignored; a malformed payload is the zero Payload.
      fields:
        - {name: Model, type: PayloadModel, tag: 'json:"model"'}
        - {name: Workspace, type: PayloadWorkspace, tag: 'json:"workspace"'}
        - {name: ContextWindow, type: PayloadContext, tag: 'json:"context_window"'}
        - {name: Cost, type: PayloadCost, tag: 'json:"cost"'}
        - {name: RateLimits, type: PayloadRateLimits, tag: 'json:"rate_limits"'}
        - {name: Effort, type: PayloadEffort, tag: 'json:"effort"'}
        - {name: Thinking, type: PayloadThinking, tag: 'json:"thinking"'}
        - {name: OutputStyle, type: PayloadStyle, tag: 'json:"output_style"'}
        - {name: SessionName, type: string, tag: 'json:"session_name"'}
        - {name: Transcript, type: string, tag: 'json:"transcript_path"'}
        - {name: SessionID, type: string, tag: 'json:"session_id"'}
        - {name: Version, type: string, tag: 'json:"version"'}
        - {name: FastMode, type: bool, tag: 'json:"fast_mode"'}
        - {name: Exceeds200k, type: bool, tag: 'json:"exceeds_200k_tokens"'}
      methods:
        - {name: ModelInfo, signature: "ModelInfo() ModelInfo", receiver: pointer}
        - {name: WorkingDir, signature: "WorkingDir() string", receiver: pointer}
        - {name: ContextWindowSize, signature: "ContextWindowSize() int", receiver: pointer}
        - {name: TotalTokens, signature: "TotalTokens() int", receiver: pointer}
        - {name: Progress, signature: "Progress() quota.Progress", receiver: pointer}
        - {name: StdinLimits, signature: "StdinLimits() quota.Set", receiver: pointer}
      properties: [render/property/payload-parse-total]
    - {id: render/vo/payload-model, component: render/component/session, name: PayloadModel, fields: [{name: DisplayName, type: string, tag: 'json:"display_name"'}, {name: ID, type: string, tag: 'json:"id"'}]}
    - {id: render/vo/payload-workspace, component: render/component/session, name: PayloadWorkspace, fields: [{name: CurrentDir, type: string, tag: 'json:"current_dir"'}, {name: ProjectDir, type: string, tag: 'json:"project_dir"'}]}
    - id: render/vo/payload-context
      component: render/component/session
      name: PayloadContext
      description: Every field the host sends is declared with its type, so a payload with a mistyped field is refused whole, as the legacy product did.
      fields:
        - {name: CurrentUsage, type: PayloadUsage, tag: 'json:"current_usage"'}
        - {name: TotalInputTokens, type: int, tag: 'json:"total_input_tokens"'}
        - {name: TotalOutputTokens, type: int, tag: 'json:"total_output_tokens"'}
        - {name: ContextWindowSize, type: int, tag: 'json:"context_window_size"'}
        - {name: UsedPercentage, type: "*float64", tag: 'json:"used_percentage"'}
        - {name: RemainingPercentage, type: "*float64", tag: 'json:"remaining_percentage"'}
    - {id: render/vo/payload-usage, component: render/component/session, name: PayloadUsage, fields: [{name: InputTokens, type: int, tag: 'json:"input_tokens"'}, {name: OutputTokens, type: int, tag: 'json:"output_tokens"'}, {name: CacheCreationInputTokens, type: int, tag: 'json:"cache_creation_input_tokens"'}, {name: CacheReadInputTokens, type: int, tag: 'json:"cache_read_input_tokens"'}]}
    - {id: render/vo/payload-thinking, component: render/component/session, name: PayloadThinking, fields: [{name: Enabled, type: bool, tag: 'json:"enabled"'}]}
    - {id: render/vo/payload-style, component: render/component/session, name: PayloadStyle, fields: [{name: Name, type: string, tag: 'json:"name"'}]}
    - {id: render/vo/payload-cost, component: render/component/session, name: PayloadCost, fields: [{name: TotalCostUSD, type: float64, tag: 'json:"total_cost_usd"'}, {name: TotalDurationMs, type: int64, tag: 'json:"total_duration_ms"'}, {name: TotalAPIDurationMs, type: int64, tag: 'json:"total_api_duration_ms"'}, {name: TotalLinesAdded, type: int, tag: 'json:"total_lines_added"'}, {name: TotalLinesRemoved, type: int, tag: 'json:"total_lines_removed"'}]}
    - {id: render/vo/payload-rate-limits, component: render/component/session, name: PayloadRateLimits, fields: [{name: FiveHour, type: "*PayloadRateLimit", tag: 'json:"five_hour"'}, {name: SevenDay, type: "*PayloadRateLimit", tag: 'json:"seven_day"'}]}
    - id: render/vo/payload-rate-limit
      component: render/component/session
      name: PayloadRateLimit
      fields:
        - {name: UsedPercentage, type: "*float64", tag: 'json:"used_percentage"'}
        - {name: Utilization, type: "*float64", tag: 'json:"utilization"'}
        - {name: ResetsAt, type: quota.Timestamp, tag: 'json:"resets_at"'}
      methods:
        - {name: Percent, signature: "Percent() (int, bool)", receiver: pointer}
    - {id: render/vo/payload-effort, component: render/component/session, name: PayloadEffort, fields: [{name: Level, type: string, tag: 'json:"level"'}]}
    - id: render/vo/model-info
      component: render/component/session
      name: ModelInfo
      fields: [{name: Name, type: string}, {name: Version, type: string}]
      methods:
        - {name: FullName, signature: "FullName() string", receiver: value}
        - {name: ShortName, signature: "ShortName() string", receiver: value}
    # render/component/powerline
    - id: render/vo/icons
      component: render/component/powerline
      name: Icons
      fields: [{name: OS, type: bool}, {name: Path, type: bool}, {name: Git, type: bool}, {name: Model, type: bool}]
    - id: render/vo/frame
      component: render/component/powerline
      name: Frame
      description: Everything one render draws. Now is the instant countdowns, burn cursors and the task pulse are drawn at.
      fields:
        - {name: Model, type: session.ModelInfo}
        - {name: Effort, type: string}
        - {name: FastMode, type: bool}
        - {name: SessionName, type: string}
        - {name: Cost, type: float64}
        - {name: Limits, type: quota.Set}
        - {name: Icons, type: Icons}
        - {name: Width, type: int}
        - {name: Dir, type: string}
        - {name: Git, type: snapshot.GitStatus}
        - {name: Changes, type: snapshot.Changes}
        - {name: System, type: snapshot.System}
        - {name: MCP, type: snapshot.MCPServers}
        - {name: Health, type: snapshot.Health}
        - {name: Tasks, type: snapshot.TaskBoard}
        - {name: Working, type: bool}
        - {name: Update, type: snapshot.UpdateNotice}
        - {name: Now, type: time.Time}

  functions:
    - {id: render/function/parse-payload, component: render/component/session, name: Parse, signature: "Parse(data []byte) Payload"}
    - {id: render/function/effort-rank, component: render/component/session, name: EffortRank, signature: "EffortRank(level string) (int, bool)", properties: [render/property/effort-rank-scale]}
    - {id: render/function/effort-steps, component: render/component/session, name: EffortSteps, signature: "EffortSteps() int"}
    - {id: render/function/render, component: render/component/powerline, name: Render, signature: "Render(frame Frame) string", properties: [render/property/two-lines, render/property/line-one-fits]}
    - {id: render/function/condensed, component: render/component/powerline, name: Condensed, signature: "Condensed(frame Frame) []string", properties: [render/property/condense-monotonic]}
    - {id: render/function/visible-width, component: render/component/powerline, name: VisibleWidth, signature: "VisibleWidth(s string) int", properties: [render/property/visible-width-ignores-escapes, render/property/visible-width-additive]}
    - {id: render/function/parse-width, component: render/component/powerline, name: ParseWidth, signature: "ParseWidth(value string) int", properties: [render/property/parse-width-bounded]}
    - {id: render/function/icons-from-env, component: render/component/powerline, name: IconsFromEnv, signature: "IconsFromEnv(getenv func(string) string) Icons"}

  useCases:
    - id: render/usecase/show-status-line
      component: render/component/show
      name: ShowStatusLine
      input:
        name: ShowInput
        fields:
          - {name: Stdin, type: "[]byte"}
          - {name: Columns, type: string}
          - {name: TaskListID, type: string}
          - {name: Getenv, type: "func(string) string"}
      output:
        name: ShowOutput
        fields:
          - {name: Line, type: string}
          - {name: Origin, type: SnapshotOrigin}
      errors: []
      links:
        - {port: render/port/clock@v1, mode: sync}
        - {port: render/port/snapshot-source@v1, mode: sync}
      scenarios:
        success:
          - {id: warm-daemon, description: "the daemon answers: the line is the snapshot rendered with stdin's quotas winning"}
          - {id: cold-cache, description: "no daemon: the cached snapshot of the key is rendered and Origin is cache"}
          - {id: nothing-known, description: "no daemon, no cache: the line renders from stdin alone"}
          - {id: malformed-stdin, description: "a malformed payload renders the zero session, never an error"}
        refusal: []
      properties: [render/property/show-total]
    - id: render/usecase/daemon-status
      component: render/component/ctl
      name: DaemonStatus
      input: {name: StatusInput, fields: []}
      output: {name: StatusOutput, fields: [{name: Running, type: bool}, {name: Status, type: ipc.Status}]}
      links: [{port: render/port/daemon-control@v1, mode: sync}]
      scenarios:
        success: [{id: running, description: "a running daemon reports its Status"}, {id: stopped, description: "no daemon: Running is false"}]
        refusal: []
    - id: render/usecase/stop-daemon
      component: render/component/ctl
      name: StopDaemon
      input: {name: StopInput, fields: []}
      output: {name: StopOutput, fields: [{name: WasRunning, type: bool}]}
      links: [{port: render/port/daemon-control@v1, mode: sync}]
      scenarios:
        success: [{id: stops, description: "a running daemon answers then exits"}, {id: none, description: "no daemon: nothing to stop"}]
        refusal: []

  inbound:
    - id: render/inbound/cli
      component: render/component/cli
      kind: cli
      name: Run
      signature: "Run(in RunInput) int"
      input:
        name: RunInput
        fields:
          - {name: Args, type: "[]string"}
          - {name: Stdin, type: io.Reader}
          - {name: Stdout, type: io.Writer}
          - {name: Getenv, type: "func(string) string"}
          - {name: Version, type: string}
      commands:
        - {argv: "", usecase: render/usecase/show-status-line}
        - {argv: "daemon status", usecase: render/usecase/daemon-status}
        - {argv: "daemon stop", usecase: render/usecase/stop-daemon}
        - {argv: "-v | --version", prints: "statusline <version>"}

  properties:
    - {id: render/property/payload-parse-total, test: session.TestPropertyParseTotal, description: "Parse never panics; a non-object yields the zero Payload"}
    - {id: render/property/effort-rank-scale, test: session.TestPropertyEffortRank, description: "EffortRank is 1..EffortSteps on the scale, false elsewhere"}
    - {id: render/property/two-lines, test: powerline.TestPropertyTwoLines, description: "Render always ends with a newline and holds exactly 2+gap lines"}
    - {id: render/property/line-one-fits, test: powerline.TestPropertyLineOneFits, description: "line one fits COLUMNS-4 whenever its leanest level does"}
    - {id: render/property/condense-monotonic, test: powerline.TestPropertyCondenseMonotonic, description: "narrowing the width never widens line one and never restores a condensed segment"}
    - {id: render/property/visible-width-ignores-escapes, test: powerline.TestPropertyVisibleWidthEscapes, description: "inserting SGR escapes never changes VisibleWidth"}
    - {id: render/property/visible-width-additive, test: powerline.TestPropertyVisibleWidthAdditive, description: "VisibleWidth(a+b) == VisibleWidth(a)+VisibleWidth(b) for escape-free strings"}
    - {id: render/property/parse-width-bounded, test: powerline.TestPropertyParseWidth, description: "ParseWidth is in [1, 10000], 120 for anything implausible"}
    - {id: render/property/show-total, test: show.TestPropertyShowTotal, description: "ShowStatusLine yields a two-line output for any stdin bytes"}
