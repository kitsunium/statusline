# Quotas: the context window and the account's rate limits. Shared by both
# roles (the client merges what stdin carries with what the daemon fetched),
# hence a library. Every function here is pure: time is an argument.
apiVersion: kit.kitsunium/design/v1
kind: Domain
metadata:
  name: quota
spec:
  components:
    - id: quota/component/quota
      role: library
      package: quota
      uses: []

  constants:
    - {id: quota/const/session-window, name: SessionWindow, type: time.Duration, value: "5 * time.Hour"}
    - {id: quota/const/weekly-window, name: WeeklyWindow, type: time.Duration, value: "7 * 24 * time.Hour"}

  valueObjects:
    - id: quota/vo/kind
      name: Kind
      underlying: string
      values: {KindContext: context, KindSession: session, KindWeekly: weekly, KindScoped: weekly_scoped, KindExtra: extra}
    - id: quota/vo/source
      name: Source
      underlying: string
      values: {SourceStdin: stdin, SourceAPI: api, SourceNone: ""}
    - id: quota/vo/level
      name: Level
      underlying: int
      values: {LevelLow: 0, LevelMedium: 1, LevelHigh: 2, LevelCritical: 3}
    - id: quota/vo/progress
      name: Progress
      fields:
        - {name: Percent, type: int, tag: 'json:"percent"'}
      methods:
        - {name: Level, signature: "Level() Level", receiver: value}
      constructors:
        - {name: NewProgress, signature: "NewProgress(totalTokens, contextSize int) Progress"}
      properties: [quota/property/progress-bounded]
    - id: quota/vo/timestamp
      name: Timestamp
      description: An instant decoded from a Unix epoch in seconds (stdin) or an RFC 3339 string (usage API); anything else is the zero instant, never an error.
      embeds: [time.Time]
      methods:
        - {name: UnmarshalJSON, signature: "UnmarshalJSON(data []byte) error", receiver: pointer, standard: true}
      properties: [quota/property/timestamp-total]
    - id: quota/vo/limit
      name: Limit
      description: One quota and its refill schedule. A zero Limit means the plan does not expose it, never 0 %.
      fields:
        - {name: Kind, type: Kind, tag: 'json:"kind,omitempty"'}
        - {name: Label, type: string, tag: 'json:"label,omitempty"'}
        - {name: Percent, type: int, tag: 'json:"percent,omitempty"'}
        - {name: ResetsAt, type: time.Time, tag: 'json:"resets_at,omitzero"'}
        - {name: Window, type: time.Duration, tag: 'json:"window,omitempty"'}
        - {name: Active, type: bool, tag: 'json:"active,omitempty"'}
        - {name: Source, type: Source, tag: 'json:"source,omitempty"'}
      constructors:
        - {name: NewLimit, signature: "NewLimit(kind Kind, label string, percent int, resetsAt time.Time, window time.Duration, source Source) Limit"}
      methods:
        - {name: IsValid, signature: "IsValid() bool", receiver: value}
        - {name: HasWindow, signature: "HasWindow() bool", receiver: value}
        - {name: Remaining, signature: "Remaining(now time.Time) time.Duration", receiver: value}
        - {name: Elapsed, signature: "Elapsed(now time.Time) float64", receiver: value}
        - {name: CursorPosition, signature: "CursorPosition(now time.Time) int", receiver: value}
        - {name: Pace, signature: "Pace(now time.Time) int", receiver: value}
        - {name: IsOnTrack, signature: "IsOnTrack(now time.Time) bool", receiver: value}
        - {name: Projected, signature: "Projected(now time.Time) int", receiver: value}
        - {name: ExhaustsIn, signature: "ExhaustsIn(now time.Time) (time.Duration, bool)", receiver: value}
        - {name: Progress, signature: "Progress() Progress", receiver: value}
      properties: [quota/property/percent-clamped, quota/property/elapsed-bounded, quota/property/exhaustion-before-reset]
    - id: quota/vo/extra
      name: Extra
      description: The monthly extra-usage credit balance, in minor units.
      fields:
        - {name: Enabled, type: bool, tag: 'json:"enabled,omitempty"'}
        - {name: Percent, type: int, tag: 'json:"percent,omitempty"'}
        - {name: UsedMinor, type: int, tag: 'json:"used_minor,omitempty"'}
        - {name: LimitMinor, type: int, tag: 'json:"limit_minor,omitempty"'}
        - {name: Currency, type: string, tag: 'json:"currency,omitempty"'}
        - {name: Exponent, type: int, tag: 'json:"exponent,omitempty"'}
        - {name: Source, type: Source, tag: 'json:"source,omitempty"'}
      methods:
        - {name: IsValid, signature: "IsValid() bool", receiver: value}
    - id: quota/vo/set
      name: Set
      description: Every quota that applies to the session; any field but Context may be absent.
      fields:
        - {name: Context, type: Limit, tag: 'json:"context"'}
        - {name: Session, type: Limit, tag: 'json:"session"'}
        - {name: Weekly, type: Limit, tag: 'json:"weekly"'}
        - {name: Scoped, type: "[]Limit", tag: 'json:"scoped,omitempty"'}
        - {name: Extra, type: Extra, tag: 'json:"extra"'}
      methods:
        - {name: Timed, signature: "Timed() []Limit", receiver: value}
        - {name: HasTimed, signature: "HasTimed() bool", receiver: value}
        - {name: ScopedFor, signature: "ScopedFor(modelName string) []Limit", receiver: value}

  functions:
    - id: quota/function/resolve
      name: Resolve
      signature: "Resolve(stdin, api Set) Set"
      description: stdin wins wherever both carry a bucket; the API only adds what stdin cannot know (scoped quotas, credits) and the buckets stdin omitted. A bucket absent from both stays absent.
      evidence: [quota-sources-decision]
      properties: [quota/property/resolve-stdin-wins, quota/property/resolve-never-invents]

  properties:
    - {id: quota/property/percent-clamped, test: quota.TestPropertyPercentClamped, description: "NewLimit keeps Percent in [0, 100] for any input"}
    - {id: quota/property/elapsed-bounded, test: quota.TestPropertyElapsedBounded, description: "Elapsed is in [0, 1] and CursorPosition in [0, 100] for any window, reset and now"}
    - {id: quota/property/exhaustion-before-reset, test: quota.TestPropertyExhaustionBeforeReset, description: "ExhaustsIn reports true only with a duration shorter than Remaining"}
    - {id: quota/property/progress-bounded, test: quota.TestPropertyProgressBounded, description: "NewProgress is in [0, 100] and Level is monotonic in Percent"}
    - {id: quota/property/timestamp-total, test: quota.TestPropertyTimestampTotal, description: "UnmarshalJSON never fails, whatever the bytes"}
    - {id: quota/property/resolve-stdin-wins, test: quota.TestPropertyResolveStdinWins, description: "a valid stdin session or weekly bucket is never replaced"}
    - {id: quota/property/resolve-never-invents, test: quota.TestPropertyResolveNeverInvents, description: "a bucket invalid in both inputs is invalid in the output"}
