# Participants and links are law (D18, D21); the order is a test.
apiVersion: kit.kitsunium/design/v1
kind: Sequence
metadata:
  name: render-warm
spec:
  description: A redraw while the instance's daemon runs.
  participants: [actor/host, render/component/cli, render/component/show, render/component/daemonlink, collect/component/daemon, collect/component/gather, collect/component/refresh]
  steps:
    - {from: actor/host, to: render/component/cli, call: "Run(argv=[], stdin=payload, COLUMNS)", mode: sync}
    - {from: render/component/cli, to: render/component/show, call: ShowStatusLine, mode: sync}
    - {from: render/component/show, to: render/port/clock@v1, call: Now, mode: sync}
    - {from: render/component/show, to: render/port/snapshot-source@v1, call: Snapshot, mode: sync}
    - {from: render/component/daemonlink, to: collect/component/daemon, call: "Hello, Request{op: snapshot}", mode: sync, contract: ipc/contract/daemon@v1}
    - {from: collect/component/daemon, to: collect/component/gather, call: CollectSnapshot, mode: sync}
    - {from: collect/component/gather, to: collect/component/refresh, call: LatestNetwork, mode: sync}
    - {from: collect/component/daemon, to: render/component/daemonlink, call: "Response{snapshot}", mode: reply, contract: ipc/contract/daemon@v1}
    - {from: render/component/show, to: render/component/powerline, call: Render, mode: sync}
    - {from: render/component/cli, to: actor/host, call: "stdout: two lines", mode: reply}
  test: render/show.TestSequenceRenderWarm
