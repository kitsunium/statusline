apiVersion: kit.kitsunium/design/v1
kind: Sequence
metadata:
  name: refresh-network
spec:
  description: The daemon's refresh tick. The token is read on every call and never kept.
  participants: [collect/component/daemon, collect/component/refresh, external/usage-api, external/status-page]
  steps:
    - {from: collect/component/daemon, to: collect/component/refresh, call: RefreshNetwork, mode: sync}
    - {from: collect/component/refresh, to: collect/port/network-store@v1, call: LoadNetwork, mode: sync, when: "first tick"}
    - {from: collect/component/refresh, to: collect/port/token-store@v1, call: Token, mode: sync, when: "usage due and not before RetryAfter"}
    - {from: collect/component/refresh, to: collect/port/usage-api@v1, call: Fetch, mode: sync, when: "token present"}
    - {from: collect/component/refresh, to: collect/port/status-page@v1, call: Fetch, mode: sync, when: "health due"}
    - {from: collect/component/refresh, to: collect/port/network-store@v1, call: SaveNetwork, mode: sync, when: "anything fetched or refused"}
  test: collect/refresh.TestSequenceRefreshNetwork
