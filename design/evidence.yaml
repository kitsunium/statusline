# Typed evidence (D3): official (committed extract + URL + date + hash),
# observed (replayed as a fixture, synthetic data), decision (an ADR, a
# constraint, a resolved annotation), none (assumed, counted).
apiVersion: kit.kitsunium/design/v1
kind: Evidence
metadata:
  name: statusline
spec:
  items:
    - id: usage-endpoint-shape
      type: observed
      claim: >-
        The OAuth usage endpoint answers {limits[]: {kind, group, percent,
        resets_at (RFC 3339), scope.model, is_active}, five_hour, seven_day
        (legacy, null on some plans), extra_usage}; it needs the
        `anthropic-beta: oauth-2025-04-20` header and answers 429 when polled
        too often.
      fixtures:
        - evidence/observed/usage-limits.json
        - evidence/observed/usage-legacy-buckets.json
        - evidence/observed/usage-null-buckets.json
      replayedBy: [collect/usageapi.TestDecodeObserved, testdata/parity/scenarios/usage-api-only.json]
      note: Shapes observed by the legacy product in production; the committed payloads are synthetic.
    - id: status-page-summary-shape
      type: observed
      claim: The status page summary lists components {name, status, group}; statuses operational, degraded_performance, partial_outage, major_outage, under_maintenance.
      fixtures: [evidence/observed/status-summary.json]
      replayedBy: [collect/statuspage.TestClassifyObserved, testdata/parity/scenarios/health-degraded.json]
    - id: condense-policy-decision
      type: decision
      ref: docs/adr/0002-line-one-condenses-by-levels-and-weights.md
      claim: Line one condenses by per-segment levels and weights; the OS segment never shrinks; line two is never shortened.
    - id: palette-contrast-decision
      type: decision
      ref: docs/adr/0003-every-ink-holds-4-5-to-1.md
      claim: Every ink/ground pair holds at least 4.5:1, in 24-bit and in the 256-colour fallback.
    - id: quota-sources-decision
      type: decision
      ref: docs/adr/0004-stdin-wins-and-absent-stays-absent.md
      claim: stdin wins over the API; a bucket absent from both stays absent, never 0 %.
    - id: rate-limit-decision
      type: decision
      ref: docs/adr/0001-one-binary-two-processes.md
      claim: One daemon per instance polls the usage API at most once per minute, honours Retry-After across restarts, and backs off exponentially up to an hour.
    - id: ipc-contract-decision
      type: decision
      ref: docs/adr/0001-one-binary-two-processes.md
      claim: The client and the daemon only talk through statusline.ipc/v1; the client never stops a newer daemon.
