# ci — build, vet, race tests, the parity oracle, and the design check.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race -count=1 ./...
      - name: no replace of a kitsunium module
        run: "! grep -E '^replace .*github.com/kitsunium/' go.mod"
      - name: never import the platform (D2, D17)
        run: "! go list -deps ./... | grep -q '^github.com/kitsunium/platform'"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/statusline

  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: build the binary and the harness
        run: |
          go build -o "$RUNNER_TEMP/statusline" ./cmd/statusline
          (cd testdata/parity/harness && go build -o "$RUNNER_TEMP/harness" .)
      - name: check against the legacy goldens
        working-directory: testdata/parity/harness
        run: '"$RUNNER_TEMP/harness" check -bin "$RUNNER_TEMP/statusline" -flavour kit'
      - name: latency, warm and cold (reported, not gated)
        working-directory: testdata/parity/harness
        run: |
          "$RUNNER_TEMP/harness" latency -bin "$RUNNER_TEMP/statusline" -flavour kit -runs 200 -scenario busy/default
          "$RUNNER_TEMP/harness" latency -bin "$RUNNER_TEMP/statusline" -flavour kit -cold -runs 100 -scenario busy/default

  design:
    # kit check (platform) against design/: runs once the platform pull
    # request publishes `kit`; KIT_REF is the commit it is installed from.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.KIT_REF != '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: install kit
        run: go install "github.com/kitsunium/platform/cmd/kit@${{ vars.KIT_REF }}"
      - name: kit check
        run: kit check
